<svg viewBox="0 0 1600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Logo mark -->
  <g>
    <!-- Outer dark blue square -->
    <rect x="95" y="50" width="270" height="300" fill="#001f3f" rx="8"/>

    <!-- Orange accent left -->
    <rect x="0" y="130" width="95" height="140" fill="#ff8c00"/>

    <!-- Orange accent right -->
    <rect x="370" y="130" width="95" height="140" fill="#ff8c00"/>

    <!-- Inner white frame -->
    <rect x="125" y="80" width="210" height="240" fill="none" stroke="white" stroke-width="20"/>

    <!-- Inner dark blue square -->
    <rect x="145" y="100" width="170" height="200" fill="#001f3f"/>
  </g>

  <!-- Text: INTELLOGER -->
  <text x="520" y="280" font-family="Arial, sans-serif" font-size="120" font-weight="bold" fill="#001f3f">
    INTELLO<tspan fill="#ff8c00">GER</tspan>
  </text>
</svg>
